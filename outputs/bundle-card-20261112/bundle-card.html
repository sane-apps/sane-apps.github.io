<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#f5f7fb;
background:linear-gradient(135deg,#0b1a1f 0%,#13233a 55%,#1a2350 100%);position:relative}
.blob1{position:absolute;right:-90px;top:-110px;width:470px;height:470px;border-radius:50%;background:#1f3d63;opacity:.85}
.blob2{position:absolute;left:-150px;bottom:-200px;width:470px;height:470px;border-radius:50%;background:#123540;opacity:.8}
.card{position:absolute;left:60px;top:55px;width:1080px;height:520px;border-radius:30px;
background:rgba(10,18,28,.88);border:1.5px solid #2a4560}
.left{position:absolute;left:52px;top:52px;width:560px}
.brand{font-size:36px;font-weight:600}
h1{font-size:58px;font-weight:700;margin-top:14px;letter-spacing:-.5px}
.price{font-size:38px;font-weight:600;color:#5CE8FF;margin-top:16px}
.desc{font-size:25px;line-height:1.4;color:#e1e6ef;margin-top:16px}
.note{font-size:21px;color:#b9c3d3;margin-top:10px}
.btn{display:inline-block;margin-top:30px;padding:18px 40px;border-radius:16px;background:#5CE8FF;color:#06222a;font-size:28px;font-weight:700}
.apps{position:absolute;right:56px;top:92px;width:330px}
.app{display:flex;align-items:center;gap:18px;height:96px;padding:0 22px;margin-bottom:24px;border-radius:20px;
border:1.5px solid #cfd8e3;background:rgba(10,18,28,.92);font-size:26px;font-weight:500}
.app img{width:56px;height:56px;border-radius:12px}
</style></head><body>
<div class="blob1"></div><div class="blob2"></div>
<div class="card">
  <div class="left">
    <div class="brand">SaneApps</div>
    <h1>Everything Bundle</h1>
    <div class="price">$34.99 once</div>
    <div class="desc">One license key unlocks Pro in<br>SaneClip, SaneClick and SaneHosts.</div>
    <div class="note">SaneSales and SaneVideo are free for everyone.</div>
    <div class="btn">Get the bundle</div>
  </div>
  <div class="apps">
    <div class="app"><img src="../../icons/saneclip-icon.png" alt="">SaneClip</div>
    <div class="app"><img src="../../icons/saneclick-icon.png" alt="">SaneClick</div>
    <div class="app"><img src="../../icons/sanehosts-icon.png" alt="">SaneHosts</div>
  </div>
</div>
</body></html>
